<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eed6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>山谷的呼吸 · Breath of the Valley</title>
<!--
  小天鹅 NFC 音乐盒
  UI 依据 music_box_ui.jpg 设计稿还原：
  浅粉背景 #eed6d4 · 鲑鱼粉 #e58d91 · 上下边距 44px · 左右边距 14px · 唱片垂直居中
  主题文字：山谷的呼吸 / Breath of the Valley（逐字缓慢跳跃）
  黑胶唱片（正圆三层：白色圆底 + 粉色环绕 + 黑胶，均可旋转）· 动态音符
  进度条跟随音乐、可拖动 · 播放 / 取消按钮同款式 · 右上品牌 logo 取自设计稿原图
  设计基准：iPhone 17（402×874）——UI 固定尺寸居中，
  屏幕更小时整体等比缩小，更大时仅背景色铺满。
-->
<style>
  :root {
    --pink: #eed6d4;          /* 页面背景 */
    --salmon: #e58d91;        /* 主题鲑鱼粉 */
    --salmon-light: #f7cdcc;  /* 进度条轨道 */
    --rose: #c49b9a;          /* 暂停态玫瑰灰 */
    --rose-faint: #e8d9d6;    /* 暂停态弱化元素 */
    --ink: #3a2f2f;           /* 状态栏/唱片深色 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--pink);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 设计基准 iPhone 17（402×874）：
     屏幕小于基准时整体等比缩小，大于基准时保持原尺寸居中，背景色铺满 */
  .viewport {
    width: 402px;
    height: 874px;
    flex: none;
    transform: scale(min(1, 100vw / 402px, 100vh / 874px));
    transform: scale(min(1, 100vw / 402px, 100dvh / 874px));
    transform-origin: center center;
  }
  .app {
    width: 402px;
    height: 874px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 14px; /* 左右边距 14px */
    padding-bottom: env(safe-area-inset-bottom); /* 底部由脚注的 margin-bottom 14px 控制 */
    position: relative;
  }

  /* ---------- 状态栏 44px ---------- */
  .statusbar {
    height: 44px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--rose);
    font-size: 15px;
    font-weight: 600;
    flex: none;
  }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .sb-icons svg { display: block; }

  /* ---------- 品牌 Logo（右上，直接取自设计稿原图） ---------- */
  .logo {
    align-self: flex-end;
    margin-top: 26px;
    flex: none;
  }
  .logo-img {
    display: block;
    width: 102px; /* 223px ÷ 2.18 ≈ 102pt */
    height: auto;
  }

  .stage, .panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    flex: 1; /* 唱片相对垂直居中：在 logo 与下方文字块之间自动居中 */
    justify-content: center;
  }

  /* ---------- 黑胶唱片（三层：白色大圆底 + 粉色圆环 + 黑胶，正圆旋转） ---------- */
  .vinyl-scene {
    position: relative;
    width: 256px;
    height: 256px;
    margin-top: 0; /* 由 .stage 弹性居中 */
    flex: none;
  }
  .vinyl-backdrop {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .55); /* 第一层：白色圆底（透明感） */
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 4px 22px rgba(126, 86, 84, .14);
  }
  .vinyl-pink {
    position: absolute;
    inset: 24px;
    border-radius: 50%;
    background: rgba(238, 214, 212, .55); /* 第二层：粉色环绕（透明感） */
    box-shadow:
      inset 0 0 0 1px rgba(229, 141, 145, .28),
      inset 0 2px 10px rgba(126, 86, 84, .10);
  }
  .vinyl-shadow {
    position: absolute;
    left: 12%; right: 12%; bottom: -5%;
    height: 14%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(126, 86, 84, .26), rgba(126, 86, 84, 0) 70%);
  }
  .vinyl-holder {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 156px;   /* 设计稿：唱片直径 = 屏宽 38.7% */
    height: 156px;
    transform: translate(-50%, -50%);
    z-index: 4;
  }
  .vinyl {
    width: 100%;
    height: 100%;
    border-radius: 50%; /* 第三层：黑胶，完整正圆 */
    background:
      radial-gradient(circle at 34% 32%, rgba(255,255,255,.09), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 50% 50%, #232625 0%, #1a1d1c 58%, #121413 100%);
    border: 2px solid #9da09f; /* 设计稿：外缘浅灰圈 */
    box-shadow:
      inset 0 0 0 5px #1f2221,
      inset 0 0 0 6px #2e312f,
      0 2px 14px rgba(60, 40, 38, .18);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    will-change: transform;
  }
  body.playing .vinyl { animation-play-state: running; }
  @keyframes spin {
    from { transform: rotateZ(0deg); }
    to   { transform: rotateZ(360deg); }
  }
  .grooves {
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, #1c1f1e 0px, #222524 2px, #1c1f1e 5px);
    opacity: .9;
  }
  /* 唱片中心标签：小天鹅 + LittleSwan */
  .vinyl-label {
    position: absolute;
    inset: 32%;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #f4adad 0%, var(--salmon) 58%, #d97f83 100%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55), 0 0 6px rgba(60, 40, 38, .15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* logo + 英文名 整体垂直居中 */
    gap: 3px;
  }
  .label-swan { width: 18px; height: 18px; }
  .label-text {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: .3px;
    color: #ffffff; /* LittleSwan 白色 */
  }
  /* 白色光影：随唱片旋转的扇形高光 */
  .vinyl::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 205deg,
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,.22) 30deg,
      rgba(255,255,255,.05) 60deg,
      rgba(255,255,255,0) 90deg,
      rgba(255,255,255,0) 360deg);
    pointer-events: none;
  }
  /* 唱针 */
  .tonearm {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }
  /* 旋律音符（白色，播放时在唱片上浮动） */
  .melody {
    position: absolute;
    z-index: 6;
    color: #ffffff;
    font-size: 20px;
    opacity: 0;
    animation: bob 3.4s ease-in-out infinite;
    animation-play-state: paused;
    transition: opacity .6s ease;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  }
  body.playing .melody { opacity: .92; animation-play-state: running; }
  .melody.m1 { left: 78px;  top: 78px;  animation-delay: 0s; }
  .melody.m2 { left: 182px; top: 150px; animation-delay: 1.1s; font-size: 25px; }
  .melody.m3 { left: 108px; top: 190px; animation-delay: 2.2s; font-size: 17px; }

  /* ---------- 底部装饰音符 ---------- */
  .note {
    position: absolute;
    font-size: 22px;
    color: var(--salmon);
    animation: bob 3.4s ease-in-out infinite;
    animation-play-state: paused;
    opacity: .9;
  }
  body.playing .note { animation-play-state: running; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-13px) rotate(10deg); }
  }

  /* ---------- 主题文字（逐字缓慢跳跃） ---------- */
  .title {
    margin-top: 8px; /* 唱片 → 歌曲名字 8px */
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 6px;
    color: var(--salmon);
    flex: none;
  }
  .title span {
    display: inline-block;
    animation: jump 2s ease-in-out infinite;
    animation-play-state: paused;
    will-change: transform;
  }
  body.playing .title span { animation-play-state: running; }
  .title span:nth-child(1) { animation-delay: 0s; }
  .title span:nth-child(2) { animation-delay: .14s; }
  .title span:nth-child(3) { animation-delay: .28s; }
  .title span:nth-child(4) { animation-delay: .42s; }
  .title span:nth-child(5) { animation-delay: .56s; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    28%      { transform: translateY(-0.22em); }
    52%      { transform: translateY(0); }
  }
  .subtitle {
    margin-top: 2px;
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-style: italic;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--salmon);
    flex: none;
  }
  .underline {
    width: 132px;
    height: 2px;
    border-radius: 2px;
    background: var(--salmon-light);
    margin-top: 4px;
    flex: none;
  }

  /* ---------- 进度条（跟随音乐时间，可点击 / 拖动） ---------- */
  .progress-wrap {
    width: 100%;
    margin-top: 8px; /* 歌曲名字 → 进度条 8px */
    flex: none;
  }
  .progress-track {
    width: calc(100% + 12px);
    height: 26px;
    margin: 0 -6px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none; /* 触摸拖动时不触发页面滚动 */
    outline: none;
  }
  .progress-bar {
    position: relative;
    width: 100%;
    height: 5px;
    border-radius: 5px;
    background: var(--salmon-light);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    background: var(--salmon);
  }
  .progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--salmon);
    box-shadow: 0 0 0 4px rgba(229, 141, 145, .16);
    transform: translate(-50%, -50%) scale(0);
    transition: transform .18s ease;
    pointer-events: none;
  }
  .progress-track:hover .progress-thumb,
  .progress-track:focus-visible .progress-thumb,
  .progress-track.dragging .progress-thumb { transform: translate(-50%, -50%) scale(1); }
  .progress-track:focus-visible .progress-bar { box-shadow: 0 0 0 3px rgba(229, 141, 145, .22); }
  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--salmon);
  }

  /* ---------- 底部控制区 ---------- */
  .controls {
    position: relative;
    width: 100%;
    height: 72px;
    margin-top: 8px; /* 进度条 → 播放键 8px */
    display: flex;
    align-items: flex-start;
    justify-content: center; /* 播放键居中 */
    padding-top: 2px;
    flex: none;
  }
  /* 取消键：与播放键同款式，靠左对齐 */
  #btnClose {
    position: absolute;
    left: 0;
    top: 2px;
  }
  /* 播放 / 取消按钮：同款式同大小 */
  .btn-round {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--salmon);
    background: transparent;
    color: var(--salmon);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .6s ease;
    padding: 0;
    line-height: 1;
    flex: none;
  }
  body.playing .btn-round { box-shadow: 0 0 0 6px rgba(229, 141, 145, .14); }
  .btn-round:active { transform: scale(.94); }
  .icon-pause { display: none; }
  body.playing .icon-play { display: none; }
  body.playing .icon-pause { display: inline; }
  .note.c1 { left: 16%; top: 0;  animation-delay: .4s; }
  .note.c2 { right: 14%; top: 8px; animation-delay: 1.3s; }
  .note.c3 { right: 27%; bottom: 0; animation-delay: 2.1s; font-size: 20px; }

  /* 脚注：常显，上边距 44px（与播放键间距），下边距 14px */
  .footnote {
    margin-top: 44px;
    margin-bottom: 14px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--salmon);
    flex: none;
  }
</style>
</head>
<body>

<div class="viewport">
<div class="app">

  <!-- 状态栏 44px -->
  <div class="statusbar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="5" y="6" width="3" height="6" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
        <path d="M8 9.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM5.6 6.8a3.4 3.4 0 0 1 4.8 0l-1.2 1.2a1.7 1.7 0 0 0-2.4 0L5.6 6.8zM3.1 4.3a6.9 6.9 0 0 1 9.8 0L11.7 5.5a5.2 5.2 0 0 0-7.4 0L3.1 4.3z"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".5"/>
      </svg>
    </span>
  </div>

  <!-- 品牌（直接取自设计稿原图：手写体 LittleSwan + 全心全意小天鹅） -->
  <div class="logo">
    <img class="logo-img" src="logo.png" alt="LittleSwan 全心全意小天鹅">
  </div>

  <div class="stage">
  <!-- 黑胶唱片（白色圆底 + 粉色环绕 + 黑胶三层 + 唱针 + 旋律） -->
  <div class="vinyl-scene">
    <div class="vinyl-backdrop"></div>
    <div class="vinyl-pink"></div>
    <div class="vinyl-shadow"></div>
    <div class="vinyl-holder">
      <div class="vinyl">
        <div class="grooves"></div>
        <div class="vinyl-label">
          <svg class="label-swan" viewBox="0 0 64 64" aria-hidden="true">
            <!-- 小天鹅 logo -->
            <g fill="#ffffff">
              <ellipse cx="25" cy="46" rx="13" ry="8.5"/>
              <path d="M34 43 C40 30 43 21 48 17" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round"/>
              <circle cx="49" cy="14" r="5.5"/>
              <path d="M53.5 12.5 L60 15 L53.5 17.5 Z"/>
            </g>
          </svg>
          <span class="label-text">LittleSwan</span>
        </div>
      </div>
    </div>
    <!-- 唱针（灰色，设计稿：唱片 + 唱针组合） -->
    <svg class="tonearm" viewBox="0 0 256 256" aria-hidden="true">
      <circle cx="200" cy="26" r="15" fill="#8f9492"/>
      <circle cx="200" cy="26" r="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
      <circle cx="200" cy="26" r="7" fill="#767b79"/>
      <line x1="192" y1="38" x2="168" y2="72" stroke="#8f9492" stroke-width="8" stroke-linecap="round"/>
      <line x1="190" y1="36" x2="166" y2="70" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
      <g transform="rotate(-30 160 77)">
        <rect x="148" y="72" width="24" height="10" rx="4" fill="#8f9492"/>
        <rect x="148" y="72" width="24" height="3.2" rx="1.6" fill="rgba(255,255,255,.45)"/>
      </g>
      <line x1="163" y1="82" x2="172" y2="66" stroke="#6f7472" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <!-- 旋律音符（白色，播放时浮动） -->
    <span class="melody m1">♪</span>
    <span class="melody m2">♫</span>
    <span class="melody m3">♬</span>
  </div>

  </div><!-- /.stage -->

  <div class="panel">
  <!-- 主题文字 -->
  <h1 class="title"><span>山</span><span>谷</span><span>的</span><span>呼</span><span>吸</span></h1>
  <p class="subtitle">Breath of the Valley</p>
  <div class="underline"></div>

  <!-- 进度条（可点击 / 拖动定位） -->
  <div class="progress-wrap">
    <div class="progress-track" id="progressTrack" role="slider" tabindex="0"
         aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>
    <div class="time-row">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">0:00</span>
    </div>
  </div>

  <!-- 控制区 -->
  <div class="controls">
    <span class="note c1">♪</span>
    <span class="note c2">♫</span>
    <span class="note c3">♬</span>
    <button class="btn-round" id="btnClose" aria-label="停止">✕</button>
    <button class="btn-round" id="btnMain" aria-label="播放/暂停">
      <span class="icon-play">▶</span><span class="icon-pause">❚❚</span>
    </button>
  </div>

  <!-- 脚注 -->
  <div class="footnote">轻触屏幕，开始播放</div>
  </div><!-- /.panel -->

</div>
</div><!-- /.viewport -->

<audio id="audio" src="breath-of-the-valley.m4a" loop preload="auto"></audio>

<script>
(function () {
  "use strict";
  var audio = document.getElementById("audio");
  var body = document.body;
  var fill = document.getElementById("progressFill");
  var thumb = document.getElementById("progressThumb");
  var track = document.getElementById("progressTrack");
  var timeCur = document.getElementById("timeCur");
  var timeTotal = document.getElementById("timeTotal");
  var btnMain = document.getElementById("btnMain");
  var btnClose = document.getElementById("btnClose");
  var playing = false;
  var started = false;   // 是否已成功开始过播放（用于自动播放回退）

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ":" + (sec < 10 ? "0" + sec : sec);
  }

  function setPlaying(p) {
    playing = p;
    body.classList.toggle("playing", p);
    body.classList.toggle("awaiting", !p && !started);
    if ("mediaSession" in navigator && navigator.mediaSession) {
      navigator.mediaSession.playbackState = p ? "playing" : "paused";
    }
  }

  function updateTime() {
    var d = audio.duration || 0;
    if (d > 0) {
      timeTotal.textContent = fmt(d);
      track.setAttribute("aria-valuemax", String(Math.floor(d)));
      if (!dragging) {
        var pct = (audio.currentTime / d * 100) + "%";
        fill.style.width = pct;
        thumb.style.left = pct;
        timeCur.textContent = fmt(audio.currentTime);
        track.setAttribute("aria-valuenow", String(Math.floor(audio.currentTime)));
      }
    }
  }

  // ---------- 进度条交互：点击 / 拖动定位（鼠标 + 触摸） ----------
  var dragging = false;
  var pendingSeek = null; // 元数据未就绪时的暂存定位

  function fractionFromEvent(e) {
    var r = track.querySelector(".progress-bar").getBoundingClientRect();
    var f = (e.clientX - r.left) / r.width;
    return Math.max(0, Math.min(1, f));
  }
  function seekFraction(f) {
    var d = audio.duration;
    if (d > 0) audio.currentTime = f * d;
  }

  track.addEventListener("pointerdown", function (e) {
    dragging = true;
    track.classList.add("dragging");
    if (track.setPointerCapture) {
      try { track.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
    var f = fractionFromEvent(e);
    pendingSeek = f;
    fill.style.width = (f * 100) + "%";
    thumb.style.left = (f * 100) + "%";
    timeCur.textContent = fmt(f * (audio.duration || 0));
    e.preventDefault();
  });
  track.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var f = fractionFromEvent(e);
    pendingSeek = f;
    fill.style.width = (f * 100) + "%";
    thumb.style.left = (f * 100) + "%";
    timeCur.textContent = fmt(f * (audio.duration || 0));
  });
  function endDrag(e, commit) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove("dragging");
    if (commit && e) {
      var f = fractionFromEvent(e);
      pendingSeek = null;
      seekFraction(f);
      updateTime();
    } else {
      // 拖动被系统打断（来电 / 通知下拉）：取消本次定位
      pendingSeek = null;
    }
  }
  track.addEventListener("pointerup", function (e) { endDrag(e, true); });
  track.addEventListener("pointercancel", function () { endDrag(null, false); });

  // 键盘：← → 前后 5 秒，Home / End 跳到头尾
  track.addEventListener("keydown", function (e) {
    var d = audio.duration || 0;
    if (d <= 0) return;
    var t = audio.currentTime;
    if (e.key === "ArrowLeft") t -= 5;
    else if (e.key === "ArrowRight") t += 5;
    else if (e.key === "Home") t = 0;
    else if (e.key === "End") t = d;
    else return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(d, t));
    updateTime();
  });

  function play() {
    var p = audio.play();
    if (p && p.then) {
      p.then(function () {
        started = true;
        setPlaying(true);
      }).catch(function () {
        setPlaying(false);
      });
    } else {
      started = true;
      setPlaying(true);
    }
  }

  function pause() {
    audio.pause();
    setPlaying(false);
  }

  function stop() {
    audio.pause();
    audio.currentTime = 0;
    setPlaying(false);
    updateTime();
  }

  // 状态栏显示真实时间
  function updateClock() {
    var d = new Date();
    var m = d.getMinutes();
    document.getElementById("sbTime").textContent =
      d.getHours() + ":" + (m < 10 ? "0" + m : m);
  }
  updateClock();
  setInterval(updateClock, 30000);

  // 歌曲信息（锁屏 / 媒体通知）
  if ("mediaSession" in navigator && navigator.mediaSession) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "山谷的呼吸",
        artist: "LittleSwan",
        album: "山谷的呼吸"
      });
      navigator.mediaSession.setActionHandler("play", play);
      navigator.mediaSession.setActionHandler("pause", pause);
    } catch (e) { /* 忽略不支持的环境 */ }
  }

  audio.addEventListener("timeupdate", updateTime);
  audio.addEventListener("loadedmetadata", function () {
    updateTime();
    if (pendingSeek !== null) {
      seekFraction(pendingSeek);
      pendingSeek = null;
      updateTime();
    }
  });
  audio.addEventListener("ended", updateTime);
  audio.addEventListener("play", function () { setPlaying(true); });
  audio.addEventListener("pause", function () { setPlaying(false); });
  audio.addEventListener("error", function () {
    body.classList.add("awaiting");
    body.classList.remove("playing");
  });

  // 页面加载即尝试自动播放（NFC 触碰打开时，部分机型视作用户手势）
  window.addEventListener("load", function () {
    updateTime();
    play();
  });

  // 自动播放被拦截时：任意触摸开始播放
  document.addEventListener("pointerdown", function (e) {
    if (!playing && !started && !e.target.closest("button")) play();
  });

  btnMain.addEventListener("click", function () {
    if (playing) pause(); else play();
  });
  btnClose.addEventListener("click", stop);
})();
</script>
</body>
</html>
