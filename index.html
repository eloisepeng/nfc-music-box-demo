<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0d0d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>秋日疗愈白噪音</title>
<!--
  小天鹅 NFC 音乐盒 · 按 spec.jpg 设计稿布局
  44px 状态栏 · 右上 logo（logo.png 含手写英文+中文）· 14px 左右边距
  唱片叠层（circle1 → DONUT 中右 → circle2 → circle3 → needle 右上）居中于 ~43% 高度
  动态音符行 · 山谷的呼吸 / Breath of the Valley（逐字跳跃）· 下划线
  进度条（bar + 椭圆4 滑块 + 0:00 / 1:31 时间）· 取消 ✕ + 播放/暂停大圆按钮 + buttons.png
  脚注（底部 14px）· 设计基准 iPhone 17（402×874），UI 固定尺寸居中缩放
-->
<style>
  :root {
    --salmon: #e58d91;        /* 主题鲑鱼粉 */
    --salmon-bright: #f58e91; /* 高亮鲑鱼粉 */
    --salmon-light: #f7cdcc;  /* 浅鲑鱼 */
    --light-pink: #eecac4;
    --rose: #c49b9a;          /* 状态栏玫瑰灰 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #f0d0d0 url("assets/底图.png") center / cover no-repeat;
    color: #3a2f2f;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 设计基准 iPhone 17（402×874） */
  .viewport {
    width: 402px;
    height: 874px;
    flex: none;
    transform: scale(min(1, 100vw / 402px, 100vh / 874px));
    transform: scale(min(1, 100vw / 402px, 100dvh / 874px));
    transform-origin: center center;
  }
  .app {
    width: 402px;
    height: 874px;
    position: relative;
  }

  /* ---------- 状态栏 44px（顶部边距 14px） ---------- */
  .statusbar {
    height: 44px;
    width: 100%;
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    color: var(--rose);
    font-size: 15px;
    font-weight: 600;
  }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .sb-icons svg { display: block; }

  /* ---------- 左上品牌（logo.png 含英文+中文） ---------- */
  .logo-top {
    position: absolute;
    left: 14px;
    top: 70px;
  }
  .logo-top img { display: block; width: 70px; height: auto; }

  /* ---------- 唱片叠层（圆心 ~43.4% 高度，即 379px；黑胶圆心 +30px） ---------- */
  .record-stack {
    position: absolute;
    left: 50%;
    top: 349px;
    transform: translate(-50%, -50%);
    width: 298px;
    height: 350px;
  }
  .stack-ellipse { /* circle1：正圆，所有圆层的最底层 */
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 356px;
    height: 356px;
  }
  .stack-donut { /* DONUT：circle2 右侧、叠在 circle1 之上 */
    position: absolute;
    left: 277px;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: auto;
    pointer-events: none;
  }
  .stack-pink {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 310px;
    height: 310px;
  }
  .vinyl-wrap { /* circle3：与 circle2 相对居中 */
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 182px;
    height: 182px;
  }
  .vinyl-disc {
    width: 100%;
    height: 100%;
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    will-change: transform;
  }
  body.playing .vinyl-disc { animation-play-state: running; }
  @keyframes spin {
    from { transform: rotateZ(0deg); }
    to   { transform: rotateZ(360deg); }
  }
  .tonearm { /* needle：圆圈层的相对右上角 */
    position: absolute;
    left: 186px;
    top: 18px;
    width: 94px;
    height: auto;
    pointer-events: none;
    transform-origin: 70% 4%; /* 以悬臂头为轴 */
    transition: transform .6s ease;
  }
  /* 音乐暂停时：针头向右摆 10°（播放时归位） */
  body:not(.playing) .tonearm { transform: rotate(10deg); }
  .white-note {
    position: absolute;
    color: #ffffff;
    opacity: 0;
    animation: bob 3.4s ease-in-out infinite;
    animation-play-state: paused;
    transition: opacity .6s ease;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .15);
  }
  body.playing .white-note { opacity: .95; animation-play-state: running; }
  .white-note.n1 { left: 36px;  top: 24px;  font-size: 20px; animation-delay: 0s; }
  .white-note.n2 { left: 128px; top: 20px;  font-size: 24px; animation-delay: 1.1s; }
  .white-note.n3 { left: 226px; top: 26px;  font-size: 17px; animation-delay: 2.2s; }

  /* ---------- 动态音符行（规格图：唱片与标题之间） ---------- */
  .notes-row {
    position: absolute;
    left: 0; right: 0;
    top: 545px;
    height: 30px;
  }
  .note {
    position: absolute;
    font-size: 20px;
    color: var(--salmon);
    animation: bob 3.4s ease-in-out infinite;
    animation-play-state: paused;
    opacity: .85;
  }
  body.playing .note { animation-play-state: running; }
  .note.n1 { left: 24%;  top: 2px;  animation-delay: 0s; }
  .note.n2 { left: 46%;  top: 10px; animation-delay: .9s;  font-size: 24px; }
  .note.n3 { left: 70%;  top: 0;    animation-delay: 1.7s; font-size: 18px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-11px) rotate(10deg); }
  }

  /* ---------- 标题 / 副标题 / 下划线 ---------- */
  .title {
    position: absolute;
    left: 0; right: 0;
    top: 589px;
    text-align: center;
    font-size: 29px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--salmon);
  }
  .title span {
    display: inline-block;
    animation: jump 2s ease-in-out infinite;
    animation-play-state: paused;
    will-change: transform;
  }
  body.playing .title span { animation-play-state: running; }
  .title span:nth-child(1) { animation-delay: 0s; }
  .title span:nth-child(2) { animation-delay: .14s; }
  .title span:nth-child(3) { animation-delay: .28s; }
  .title span:nth-child(4) { animation-delay: .42s; }
  .title span:nth-child(5) { animation-delay: .56s; }
  .title span:nth-child(6) { animation-delay: .70s; }
  .title span:nth-child(7) { animation-delay: .84s; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    28%      { transform: translateY(-0.22em); }
    52%      { transform: translateY(0); }
  }
  .subtitle {
    position: absolute;
    left: 0; right: 0;
    top: 627px;
    text-align: center;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 4px;
    color: var(--salmon);
  }
  .underline {
    position: absolute;
    left: 50%;
    top: 655px;
    transform: translateX(-50%);
    width: 132px;
    height: 2px;
    border-radius: 2px;
    background: var(--salmon-light);
  }

  /* ---------- 进度条（可点击 / 拖动） ---------- */
  .progress-wrap { /* 与标题区（下划线）间距 8px */
    position: absolute;
    left: 50%;
    top: 665px;
    transform: translateX(-50%);
    width: 322px;
    height: 28px;
    cursor: pointer;
    touch-action: none;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .progress-bar {
    position: relative;
    width: 100%;
    height: 5px;
  }
  .progress-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: .9;
    transition: opacity .6s ease;
  }
  body.playing .progress-line { opacity: .3; }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--salmon-bright);
    border-radius: 5px;
  }
  .progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%) scale(0);
    transition: transform .18s ease;
    pointer-events: none;
  }
  .progress-wrap:hover .progress-thumb,
  .progress-wrap:focus-visible .progress-thumb,
  .progress-wrap.dragging .progress-thumb { transform: translate(-50%, -50%) scale(1); }
  .progress-wrap:focus-visible { box-shadow: 0 0 0 3px rgba(229, 141, 145, .22); border-radius: 6px; }
  .time-row {
    position: absolute;
    left: 50%;
    top: 679px;
    transform: translateX(-50%);
    width: 322px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--salmon);
  }

  /* ---------- 底部按钮区 ---------- */
  .btn-main { /* 底部边距 44px */
    position: absolute;
    left: 50%;
    top: 744px;
    transform: translate(-50%, -50%);
    width: 86px;
    height: 86px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
  }
  .btn-main img { width: 100%; height: 100%; display: block; }
  .btn-main:active { transform: translate(-50%, -50%) scale(.94); }
  .icon-pause-img { display: none; } /* 暂停时移除 pause_button.png */
  body.playing .icon-play-img { display: none; }
  body.playing .icon-pause-img { display: inline; }
  body:not(.playing) .icon-pause-img { display: none; }
  .btn-close { /* 取消 ✕：与播放键同款式同大小，靠左对齐 */
    position: absolute;
    left: 40px;
    top: 716px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--salmon);
    background: transparent;
    color: var(--salmon);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .6s ease;
    padding: 0;
    line-height: 1;
  }
  body.playing .btn-close { box-shadow: 0 0 0 6px rgba(229, 141, 145, .14); }
  .btn-close:active { transform: scale(.94); }
  /* ---------- 脚注（底部边距 14px） ---------- */
  .footnote {
    position: absolute;
    left: 0; right: 0;
    bottom: 14px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--salmon-bright);
  }
</style>
</head>
<body>

<div class="viewport">
<div class="app">

  <!-- 状态栏 44px -->
  <div class="statusbar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="5" y="6" width="3" height="6" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
        <path d="M8 9.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM5.6 6.8a3.4 3.4 0 0 1 4.8 0l-1.2 1.2a1.7 1.7 0 0 0-2.4 0L5.6 6.8zM3.1 4.3a6.9 6.9 0 0 1 9.8 0L11.7 5.5a5.2 5.2 0 0 0-7.4 0L3.1 4.3z"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".5"/>
      </svg>
    </span>
  </div>

  <!-- 右上品牌 -->
  <div class="logo-top">
    <img src="assets/logo.png" alt="LittleSwan 全心全意小天鹅">
  </div>

  <!-- 唱片叠层 -->
  <div class="record-stack">
    <img class="stack-ellipse" src="assets/circle1.png" alt="">
    <img class="stack-donut" src="assets/DONUT.png" alt="">
    <img class="stack-pink" src="assets/circle2.png" alt="">
    <div class="vinyl-wrap">
      <img class="vinyl-disc" src="assets/circle3.png" alt="">
    </div>
    <img class="tonearm" src="assets/needle.png" alt="">
    <span class="white-note n1">♪</span>
    <span class="white-note n2">♫</span>
    <span class="white-note n3">♬</span>
  </div>

  <!-- 动态音符行 -->
  <div class="notes-row">
    <span class="note n1">♪</span>
    <span class="note n2">♫</span>
    <span class="note n3">♬</span>
  </div>

  <!-- 标题 / 副标题 -->
  <h1 class="title"><span>秋</span><span>日</span><span>疗</span><span>愈</span><span>白</span><span>噪</span><span>音</span></h1>
  <p class="subtitle">中秋安康 身心皆愈</p>
  <div class="underline"></div>

  <!-- 进度条（可点击 / 拖动定位） -->
  <div class="progress-wrap" id="progressTrack" role="slider" tabindex="0"
       aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <div class="progress-bar">
      <img class="progress-line" src="assets/bar.png" alt="">
      <div class="progress-fill" id="progressFill"></div>
      <img class="progress-thumb" id="progressThumb" src="assets/椭圆 4.png" alt="">
    </div>
  </div>
  <div class="time-row">
    <span id="timeCur">0:00</span>
    <span id="timeTotal">0:00</span>
  </div>

  <!-- 取消 + 播放/暂停按钮 + 同层级 buttons.png -->
  <button class="btn-close" id="btnClose" aria-label="停止">✕</button>
  <button class="btn-main" id="btnMain" aria-label="播放/暂停">
    <img class="icon-play-img" src="assets/play_button.png" alt="播放">
    <img class="icon-pause-img" src="assets/pause_button.png" alt="暂停">
  </button>

  <!-- 脚注 -->
  <div class="footnote">轻触屏幕，开始播放</div>

</div>
</div><!-- /.viewport -->

<audio id="audio" src="assets/breath-of-the-valley.m4a" loop preload="auto"></audio>

<script>
(function () {
  "use strict";
  var audio = document.getElementById("audio");
  var body = document.body;
  var fill = document.getElementById("progressFill");
  var thumb = document.getElementById("progressThumb");
  var track = document.getElementById("progressTrack");
  var timeCur = document.getElementById("timeCur");
  var timeTotal = document.getElementById("timeTotal");
  var btnMain = document.getElementById("btnMain");
  var btnClose = document.getElementById("btnClose");
  var playing = false;
  var started = false;   // 是否已成功开始过播放（用于自动播放回退）

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ":" + (sec < 10 ? "0" + sec : sec);
  }

  function setPlaying(p) {
    playing = p;
    body.classList.toggle("playing", p);
    if ("mediaSession" in navigator && navigator.mediaSession) {
      navigator.mediaSession.playbackState = p ? "playing" : "paused";
    }
  }

  function updateTime() {
    var d = audio.duration || 0;
    if (d > 0) {
      timeTotal.textContent = fmt(d);
      track.setAttribute("aria-valuemax", String(Math.floor(d)));
      if (!dragging) {
        var pct = (audio.currentTime / d * 100) + "%";
        fill.style.width = pct;
        thumb.style.left = pct;
        timeCur.textContent = fmt(audio.currentTime);
        track.setAttribute("aria-valuenow", String(Math.floor(audio.currentTime)));
      }
    }
  }

  // ---------- 进度条交互：点击 / 拖动定位（鼠标 + 触摸） ----------
  var dragging = false;
  var pendingSeek = null;

  function fractionFromEvent(e) {
    var r = track.querySelector(".progress-bar").getBoundingClientRect();
    var f = (e.clientX - r.left) / r.width;
    return Math.max(0, Math.min(1, f));
  }
  function seekFraction(f) {
    var d = audio.duration;
    if (d > 0) audio.currentTime = f * d;
  }

  track.addEventListener("pointerdown", function (e) {
    dragging = true;
    track.classList.add("dragging");
    if (track.setPointerCapture) {
      try { track.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
    var f = fractionFromEvent(e);
    pendingSeek = f;
    fill.style.width = (f * 100) + "%";
    thumb.style.left = (f * 100) + "%";
    timeCur.textContent = fmt(f * (audio.duration || 0));
    e.preventDefault();
  });
  track.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var f = fractionFromEvent(e);
    pendingSeek = f;
    fill.style.width = (f * 100) + "%";
    thumb.style.left = (f * 100) + "%";
    timeCur.textContent = fmt(f * (audio.duration || 0));
  });
  function endDrag(e, commit) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove("dragging");
    if (commit && e) {
      var f = fractionFromEvent(e);
      pendingSeek = null;
      seekFraction(f);
      updateTime();
    } else {
      pendingSeek = null;
    }
  }
  track.addEventListener("pointerup", function (e) { endDrag(e, true); });
  track.addEventListener("pointercancel", function () { endDrag(null, false); });

  // 键盘：← → 前后 5 秒，Home / End 跳到头尾
  track.addEventListener("keydown", function (e) {
    var d = audio.duration || 0;
    if (d <= 0) return;
    var t = audio.currentTime;
    if (e.key === "ArrowLeft") t -= 5;
    else if (e.key === "ArrowRight") t += 5;
    else if (e.key === "Home") t = 0;
    else if (e.key === "End") t = d;
    else return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(d, t));
    updateTime();
  });

  function play() {
    var p = audio.play();
    if (p && p.then) {
      p.then(function () {
        started = true;
        setPlaying(true);
      }).catch(function () {
        setPlaying(false);
      });
    } else {
      started = true;
      setPlaying(true);
    }
  }

  function pause() {
    audio.pause();
    setPlaying(false);
  }

  function stop() {
    audio.pause();
    audio.currentTime = 0;
    setPlaying(false);
    updateTime();
  }

  // 状态栏显示真实时间
  function updateClock() {
    var d = new Date();
    var m = d.getMinutes();
    document.getElementById("sbTime").textContent =
      d.getHours() + ":" + (m < 10 ? "0" + m : m);
  }
  updateClock();
  setInterval(updateClock, 30000);

  // 歌曲信息（锁屏 / 媒体通知）
  if ("mediaSession" in navigator && navigator.mediaSession) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "山谷的呼吸",
        artist: "LittleSwan",
        album: "山谷的呼吸"
      });
      navigator.mediaSession.setActionHandler("play", play);
      navigator.mediaSession.setActionHandler("pause", pause);
    } catch (e) { /* 忽略不支持的环境 */ }
  }

  audio.addEventListener("timeupdate", updateTime);
  audio.addEventListener("loadedmetadata", function () {
    updateTime();
    if (pendingSeek !== null) {
      seekFraction(pendingSeek);
      pendingSeek = null;
      updateTime();
    }
  });
  audio.addEventListener("ended", updateTime);
  audio.addEventListener("play", function () { setPlaying(true); });
  audio.addEventListener("pause", function () { setPlaying(false); });
  audio.addEventListener("error", function () {
    body.classList.remove("playing");
  });

  // 页面加载即尝试自动播放（NFC 触碰打开时，部分机型视作用户手势）
  window.addEventListener("load", function () {
    updateTime();
    play();
  });

  // 自动播放被拦截时：任意触摸开始播放
  document.addEventListener("pointerdown", function (e) {
    if (!playing && !started && !e.target.closest("button")) play();
  });

  btnMain.addEventListener("click", function () {
    if (playing) pause(); else play();
  });
  btnClose.addEventListener("click", stop);
})();
</script>
</body>
</html>
